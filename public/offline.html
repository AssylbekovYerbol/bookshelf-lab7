<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>You are offline · Bookshelf</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #f6f3ee; color: #1f2430; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; }
      main { width: 100%; max-width: 440px; padding: 32px 24px; text-align: center; background: #fff; border: 1px solid #e4dfd6; border-radius: 16px; box-shadow: 0 4px 14px rgba(31, 36, 48, 0.08); }
      .icon { font-size: 3rem; line-height: 1; }
      h1 { margin: 12px 0 8px; font-size: 1.5rem; }
      p { margin: 0 0 20px; color: #667085; }
      button, a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 20px; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
      button { border: 1px solid #0f766e; background: #0f766e; color: #fff; }
      a { border: 1px solid #e4dfd6; color: #1f2430; margin-left: 8px; }
      .status { margin-top: 16px; min-height: 1.4em; font-size: 0.9rem; color: #b42318; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">📡</div>
      <h1>You are offline</h1>
      <p>This page could not be loaded without an internet connection. Books you have already opened are still available once you are back in the app.</p>
      <button type="button" id="retry">Retry connection</button>
      <a href="./">Open the app</a>
      <p class="status" id="status" role="status"></p>
    </main>
    <script>
      var status = document.getElementById('status');
      document.getElementById('retry').addEventListener('click', function () {
        status.textContent = 'Checking connection…';
        fetch('manifest.json?ping=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error('bad'); window.location.href = './'; })
          .catch(function () { status.textContent = 'Still offline. Please check your connection and try again.'; });
      });
    </script>
  </body>
</html>
